services:
  postgres:
    image: postgres:16
    container_name: market_intel_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_intel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_intel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
